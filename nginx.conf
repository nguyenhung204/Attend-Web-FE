server {
    listen 80;
    listen [::]:80;
    server_name keeper.bcn.id.vn;

    location /bcn/templekeeper/ {
        proxy_pass https://nim.io.vn;
        proxy_ssl_server_name on;
        proxy_ssl_name nim.io.vn;
        proxy_http_version 1.1;
        proxy_set_header Host nim.io.vn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter 'https://nim.io.vn/bcn/templekeeper/admin/' 'https://keeper.bcn.id.vn/';
        sub_filter 'http://nim.io.vn/bcn/templekeeper/admin/' 'https://keeper.bcn.id.vn/';
        sub_filter 'https://nim.io.vn' 'https://keeper.bcn.id.vn';
        sub_filter 'http://nim.io.vn' 'https://keeper.bcn.id.vn';
        proxy_redirect ~^https?://nim\.io\.vn/admin(?:/[^?]*)?(?:\?.*)?$ https://keeper.bcn.id.vn/;
        proxy_redirect ~^/admin(?:/[^?]*)?(?:\?.*)?$ /;
        proxy_redirect ~^https?://nim\.io\.vn/bcn/templekeeper/admin(?:/[^?]*)?(?:\?.*)?$ https://keeper.bcn.id.vn/;
        proxy_redirect ~^/bcn/templekeeper/admin(?:/[^?]*)?(?:\?.*)?$ /;
        proxy_redirect ~^(.*)nim\.io\.vn(.*)$ $1keeper.bcn.id.vn$2;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /index.html {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }

    location = /ngsw.json {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }
}
